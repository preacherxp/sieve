name: Validate sample fixtures
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        tool: [maven, gradle]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/java-build
        with:
          tool: ${{ matrix.tool }}
      - name: Build Rust tooling
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          cargo +1.92.0 build --locked
      - name: Verify installation on existing projects
        env:
          IMPACT_TOOL: ${{ matrix.tool }}
        run: cargo +1.92.0 test --locked --test cli installs_build_adapters -- --ignored
      - name: Verify single-module Kotlin DSL installation
        if: matrix.tool == 'gradle'
        run: cargo +1.92.0 test --locked --test cli installs_kotlin_dsl_package -- --ignored
      - run: target/debug/sieve fixtures verify --tool ${{ matrix.tool }} --scenario all
      - name: Validate actual selective execution against the oracle
        run: >-
          target/debug/sieve fixtures verify
          --tool ${{ matrix.tool }} --scenario all --selected
          --output validation-results/selected
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.tool }}
          path: validation-results/
