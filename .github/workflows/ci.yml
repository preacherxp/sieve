name: Test impact CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: impact-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    name: Rust and selector checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Rust
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.92.0
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
  selected-tests:
    name: Selected tests
    needs: rust
    uses: ./.github/workflows/java-tests.yml
    with:
      mode: selected
  full-tests:
    name: All tests
    needs: selected-tests
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/java-tests.yml
    with:
      mode: full
