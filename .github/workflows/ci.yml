name: Test impact CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: impact-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    name: Rust and selector checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Rust
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.92.0
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
  selected-tests:
    name: Selected tests
    needs: rust
    uses: ./.github/workflows/java-tests.yml
    with:
      mode: selected
  selected-variants:
    name: Selected ${{ matrix.variant }} (${{ matrix.tool }})
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        tool: [maven, gradle]
        variant: [java, kotlin, integration, edge]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/java-build
        with:
          tool: ${{ matrix.tool }}
      - name: Build selector
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          cargo +1.92.0 build --locked
      - name: Verify native dependency graph
        if: matrix.variant == 'edge'
        env:
          IMPACT_TOOL: ${{ matrix.tool }}
        run: cargo +1.92.0 test --locked --test native native_ -- --ignored --test-threads=1
      - name: Reject unsupported Gradle layouts
        if: matrix.variant == 'edge' && matrix.tool == 'gradle'
        run: cargo +1.92.0 test --locked --test native unsupported_gradle_ -- --ignored
      - name: Verify selected variants
        env:
          BUILD_TOOL: ${{ matrix.tool }}
          VARIANT: ${{ matrix.variant }}
        shell: bash
        run: |
          case "$VARIANT" in
            java) scenarios=(tax-transitive calculator unrelated gateway-implementation inherited-fixture changed-test new-test java-record) ;;
            kotlin) scenarios=(kotlin-source kotlin-sealed) ;;
            integration) scenarios=(reflection async spring-bean spring-wiring resource service-provider dependency-change) ;;
            edge) scenarios=(unused delete-class delete-test docs-only) ;;
          esac
          for scenario in "${scenarios[@]}"; do
            target/debug/sieve fixtures verify \
              --tool "$BUILD_TOOL" --scenario "$scenario" --selected \
              --output validation-results/selected
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-${{ matrix.tool }}-${{ matrix.variant }}
          path: validation-results/selected/
          retention-days: 14
  full-tests:
    name: All tests
    needs: selected-tests
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/java-tests.yml
    with:
      mode: full
  compatibility:
    name: Version compatibility
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
    uses: ./.github/workflows/compatibility.yml
  container-tests:
    name: ${{ matrix.service }} container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [Kafka, Redis, MongoDB, PostgreSQL, MySQL, RabbitMQ]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/java-build
        with:
          tool: maven
      - name: Build selector
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          cargo +1.92.0 build --locked
      - name: Verify container selection and cleanup
        env:
          IMPACT_SERVICE: ${{ matrix.service }}
        run: cargo +1.92.0 test --locked --test native selected_containers_ -- --ignored
      - name: Run container test
        if: ${{ !cancelled() }}
        env:
          TEST_CLASS: ${{ matrix.service }}Test
        run: mvn -B -ntp -f projects/containers/pom.xml "-Dtest=$TEST_CLASS" test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-${{ matrix.service }}-reports
          path: projects/containers/target/surefire-reports/
          retention-days: 14
