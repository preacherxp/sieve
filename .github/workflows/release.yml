name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install 1.92.0 --profile minimal --target "$TARGET"
          cargo +1.92.0 build --locked --release --target "$TARGET"
          mkdir dist
          tar -czf "dist/sieve-$TARGET.tar.gz" -C "target/$TARGET/release" sieve
          cd dist && shasum -a 256 "sieve-$TARGET.tar.gz" > "sieve-$TARGET.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: sieve-${{ matrix.target }}
          path: dist/
          retention-days: 1
  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
