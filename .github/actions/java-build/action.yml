name: Set up fixture build tools
description: Install the requested JDK and Maven or Gradle distribution
inputs:
  tool:
    description: maven or gradle
    required: true
  java-version:
    description: JDK version
    default: '17'
  tool-version:
    description: Maven or Gradle version
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: ${{ inputs.tool == 'maven' && 'maven' || '' }}
    - uses: gradle/actions/setup-gradle@v4
      if: inputs.tool == 'gradle'
      with:
        gradle-version: ${{ inputs.tool-version || '8.12.1' }}
        cache-read-only: ${{ github.event_name == 'pull_request' }}
    - name: Install Maven
      if: inputs.tool == 'maven'
      shell: bash
      env:
        MAVEN_VERSION: ${{ inputs.tool-version || '3.9.9' }}
      run: |
        url="https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$MAVEN_VERSION/apache-maven-$MAVEN_VERSION-bin.tar.gz"
        curl --fail --location --silent --show-error "$url" -o "$RUNNER_TEMP/maven.tar.gz"
        curl --fail --location --silent --show-error "$url.sha512" -o "$RUNNER_TEMP/maven.sha512"
        printf '%s  %s\n' "$(cat "$RUNNER_TEMP/maven.sha512")" "$RUNNER_TEMP/maven.tar.gz" | sha512sum --check
        tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/apache-maven-$MAVEN_VERSION/bin" >> "$GITHUB_PATH"
