name: Set up fixture build tools
description: Install Java 17 and the pinned Maven or Gradle distribution
inputs:
  tool:
    description: maven or gradle
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: ${{ inputs.tool == 'maven' && 'maven' || '' }}
    - uses: gradle/actions/setup-gradle@v4
      if: inputs.tool == 'gradle'
      with:
        gradle-version: '8.12.1'
        cache-read-only: ${{ github.event_name == 'pull_request' }}
    - name: Install Maven 3.9.9
      if: inputs.tool == 'maven'
      shell: bash
      run: |
        url=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.tar.gz
        curl --fail --location --silent --show-error "$url" -o "$RUNNER_TEMP/maven.tar.gz"
        curl --fail --location --silent --show-error "$url.sha512" -o "$RUNNER_TEMP/maven.sha512"
        printf '%s  %s\n' "$(cat "$RUNNER_TEMP/maven.sha512")" "$RUNNER_TEMP/maven.tar.gz" | sha512sum --check
        tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
