plugins { id 'base' }
subprojects {
    apply plugin: 'java'
    group = 'example'
    version = '1.0-SNAPSHOT'
    repositories { mavenCentral() }
    java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
    }
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        def impactModules = providers.gradleProperty('impact.modules')
        onlyIf { !impactModules.isPresent() || project.name in impactModules.get().split(',') }
        ignoreFailures = providers.gradleProperty('fixtureIgnoreFailures').map { it.toBoolean() }.getOrElse(false)
    }
    tasks.named('test') { exclude '**/*IT.class' }
    tasks.register('integrationTest', Test) {
        description = 'Runs integration fixtures.'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        include '**/*IT.class'
        shouldRunAfter tasks.named('test')
    }
    tasks.named('check') { dependsOn tasks.named('integrationTest') }
}
project(':checkout') { dependencies { implementation project(':pricing') } }
project(':runtime') { dependencies { implementation 'org.springframework:spring-context:6.1.16' } }
tasks.named('check') { dependsOn subprojects.collect { it.tasks.named('check') } }
