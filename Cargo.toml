[package]
name = "sieve"
version = "0.3.0"
edition = "2021"
rust-version = "1.92"
publish = false
description = "Conservative Java and Kotlin/JVM test selection for Maven and Gradle"
repository = "https://github.com/preacherxp/sieve"

[features]
default = ["agent"]
# Embeds the test-JVM agent that records and selects tests, and the Maven extension that
# selects test classes inside the build; needs a JDK 17+ javac to build.
agent = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.39"
tempfile = "3"
