// Shared adapter for Groovy and Kotlin DSL builds, loaded by the Rust CLI.
// Execution-time closures capture only strings, booleans and file collections, never
// Project objects, so builds using the configuration cache keep working.
import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import org.gradle.api.artifacts.FileCollectionDependency
import org.gradle.api.artifacts.ProjectDependency
import org.gradle.api.tasks.testing.Test
import org.gradle.util.GradleVersion

// Observation executes requested tests, including plugin tests, instead of restoring XML.
gradle.beforeProject { p ->
    if (p.providers.gradleProperty('impact.observe').orNull == 'true') {
        p.tasks.withType(Test).configureEach { task ->
            task.outputs.upToDateWhen { false }
            task.outputs.cacheIf { false }
        }
    }
}

// Included builds and buildSrc keep their own verification tasks and test filters.
if (gradle.parent != null) {
    return
}

if (GradleVersion.current() < GradleVersion.version('7.6.3')) {
    throw new GradleException('Sieve requires Gradle 7.6.3 or newer. Update the wrapper before running setup or tests.')
}

// A module is named by its directory, which setup requires to match its project path:
// `:services:orders` lives in `services/orders`.
def moduleId = { p -> p == p.rootProject ? '.' : p.path.substring(1).replace(':', '/') }

gradle.beforeProject { p ->
    def modules = p.providers.gradleProperty('impact.modules').orNull
    def observe = p.providers.gradleProperty('impact.observe').orNull == 'true'
    def enabled = observe || modules == null || moduleId(p) in modules.split(',')
    // Excluding unselected classes intersects the task's existing native filters.
    def selected = p.providers.gradleProperty('impact.selected').orNull
    def remaining = p.providers.gradleProperty('impact.remaining').orNull
    // Local mode: the test-record agent joins the test JVMs only, never Gradle's own daemons.
    def agent = p.providers.gradleProperty('impact.agent').orNull
    p.tasks.withType(Test).configureEach { task ->
        if (agent != null) {
            task.jvmArgs(agent)
        }
        if (!enabled) {
            task.enabled = false
        }
        if (selected != null) {
            def selection = new File(selected)
            task.dependsOn(':impactSelect')
            // An input, so that a cached test result never stands for another selection.
            task.inputs.file(selection).withPropertyName('impactSelection')
            // No selected classes means skip this task without changing its native includes.
            if (!observe) task.onlyIf {
                def lines = selection.readLines()
                lines[0] != 'none'
            }
            task.doFirst { Test test ->
                def lines = selection.readLines()
                if (!observe && lines[0] == 'exclude') {
                    lines.drop(1).each { cls ->
                        test.filter.excludeTestsMatching(cls)
                        test.filter.excludeTestsMatching(cls + '$*')
                    }
                    test.filter.failOnNoMatchingTests = false
                }
            }
        }
        if (remaining != null) {
            def exclusions = new File(remaining)
            def suite = task.name == 'test' ? 'unit' : task.name == 'integrationTest' ? 'integration' : task.name
            def key = moduleId(p) + ':' + suite
            task.inputs.file(exclusions).withPropertyName('impactRemaining')
            task.doFirst { Test test ->
                def completed = new JsonSlurper().parse(exclusions)
                (completed[key] ?: []).each { cls ->
                    test.filter.excludeTestsMatching(cls)
                    test.filter.excludeTestsMatching(cls + '$*')
                }
                test.filter.failOnNoMatchingTests = false
            }
        }
    }
}

gradle.projectsEvaluated {
    def root = gradle.rootProject
    if (root.findProperty('impact.agent') != null || root.findProperty('impact.tests') != null) {
        // Local mode's default command, and its native reference: every test task, without
        // linters or packaging.
        root.tasks.register('impactTests') {
            dependsOn(root.allprojects.collect { it.tasks.withType(Test) })
        }
    }
    def listing = root.findProperty('impact.classes')?.toString()
    if (listing != null) {
        def classes = root.files()
        def tests = root.files()
        def suites = [:]
        def suiteSettings = [:]
        def captureReceipts = root.findProperty('impact.remaining') != null
        def jvm = false
        root.allprojects.each { p ->
            def sourceSets = p.extensions.findByName('sourceSets')
            def compile = p.tasks.register('impactCompile')
            if (sourceSets != null) {
                jvm = true
                sourceSets.each { classes.from(it.output.classesDirs) }
                // Compile main and what the Test tasks run, not every source set: `check` never
                // builds a developer tool's source set, which may need local configuration.
                // Sources left uncompiled have no classes, so their changes select the module.
                def testTasks = p.tasks.withType(Test).toList()
                def main = sourceSets.findByName('main')
                compile.configure {
                    if (main == null && testTasks.isEmpty()) {
                        dependsOn(sourceSets.collect { it.classesTaskName })
                    }
                    if (main != null) {
                        dependsOn(main.classesTaskName)
                    }
                    testTasks.each { t -> dependsOn(t.testClassesDirs, t.classpath) }
                }
                testTasks.each {
                    if (it.testClassesDirs != null) {
                        tests.from(it.testClassesDirs)
                        if (captureReceipts) {
                            def suite = it.name == 'test' ? 'unit' : it.name == 'integrationTest' ? 'integration' : it.name
                            def key = moduleId(p) + ':' + suite
                            def settings = [jvmArgs: it.allJvmArgs.collect { it.toString() },
                                includes: it.filter.includePatterns.toList().sort(), excludes: it.filter.excludePatterns.toList().sort(),
                                properties: new TreeMap(it.systemProperties.collectEntries { name, value -> [(name.toString()): value?.toString()] }),
                                environment: new TreeMap(it.environment.collectEntries { name, value -> [(name.toString()): value?.toString()] })]
                            def digest = java.security.MessageDigest.getInstance('SHA-256')
                                .digest(JsonOutput.toJson(settings).getBytes('UTF-8')).encodeHex().toString()
                            def metadata = root.layout.buildDirectory.file("sieve-suite-inputs/${suiteSettings.size()}.sha256").get().asFile
                            suiteSettings[metadata] = digest
                            def agents = it.allJvmArgs.findAll { it.startsWith('-javaagent:') }
                                .collect { p.file(it.substring('-javaagent:'.length()).split('=', 2)[0]) }
                            if (!it.allJvmArgs.any { it.startsWith('@') } && agents.every { it.isFile() && it.canRead() }) {
                                // Keep native classpath order: the first duplicate class wins at runtime.
                                suites[key] = root.files(it.classpath, it.testClassesDirs, metadata, agents,
                                    it.javaLauncher.map { launcher -> [launcher.executablePath.asFile,
                                        new File(launcher.metadata.installationPath.asFile, 'release')] })
                            } else {
                                p.logger.warn("Sieve cannot verify JVM argument inputs for ${key}; execution receipts are unavailable for this suite.")
                            }
                        }
                    }
                }
            }
        }
        if (!jvm) {
            throw new GradleException('Class-level selection requires Java or Kotlin/JVM projects.')
        }
        root.tasks.register('impactClasses') {
            doLast {
                suiteSettings.each { file, digest ->
                    file.parentFile.mkdirs()
                    file.text = digest
                }
                def paths = { files -> files.collect { it.absolutePath }.unique().sort() }
                new File(listing).text = JsonOutput.toJson([
                    classes: paths(classes.files + tests.files),
                    tests: paths(tests.files),
                    suites: suites.collectEntries { key, files -> [(key): files.files.collect { it.absolutePath }.unique()] }])
            }
        }
        def selected = root.findProperty('impact.selected')?.toString()
        if (selected != null) {
            def sieve = root.property('impact.sieve').toString()
            def request = root.property('impact.request').toString()
            def chosen = (root.findProperty('impact.modules')?.toString() ?: '').split(',') as Set
            root.tasks.register('impactSelect') {
                dependsOn('impactClasses')
                dependsOn(root.allprojects.findAll { moduleId(it) in chosen }.collect { it.tasks.named('impactCompile') })
                doLast {
                    def process = new ProcessBuilder(sieve, 'classes', '--request', request)
                        .redirectErrorStream(true).start()
                    process.inputStream.eachLine { println it }
                    if (process.waitFor() != 0) {
                        throw new GradleException('Sieve could not select test classes.')
                    }
                }
            }
        }
    }
    if (root.findProperty('impact.output') != null) {
        root.tasks.register('impactInit') {
            doLast {
                def included = root.gradle.includedBuilds.collect { it.projectDir.canonicalPath }.sort()
                if (root.findProperty('impact.buildLogic') == 'true') {
                    def plugins = false
                    root.allprojects.each { p ->
                        def declaresPlugins = p.plugins.hasPlugin('java-gradle-plugin') &&
                            !p.extensions.getByName('gradlePlugin').plugins.empty
                        def sourceSets = p.extensions.findByName('sourceSets')
                        def aggregator = sourceSets == null && p.tasks.withType(Test).empty
                        if ((!declaresPlugins && !aggregator) || p.plugins.hasPlugin('application') ||
                            p.plugins.hasPlugin('com.android.application') || p.plugins.hasPlugin('com.android.library') ||
                            p.plugins.hasPlugin('org.jetbrains.kotlin.multiplatform')) {
                            throw new GradleException("Composite builds support only included plugin builds: ${p.path} must declare Gradle plugins, or be an empty aggregator.")
                        }
                        def buildRoot = root.projectDir.canonicalFile.toPath()
                        if (!p.projectDir.canonicalFile.toPath().startsWith(buildRoot) ||
                            sourceSets?.any { s -> s.allSource.srcDirs.any { !it.canonicalFile.toPath().startsWith(buildRoot) } }) {
                            throw new GradleException('Included plugin projects and sources must stay inside their build directory.')
                        }
                        plugins |= declaresPlugins
                    }
                    if (!plugins) {
                        throw new GradleException('Composite builds support only included builds that declare Gradle plugins.')
                    }
                    new File(root.property('impact.output').toString()).text = JsonOutput.toJson([included_builds: included])
                    return
                }
                def modules = [:]
                // Projects whose test code other projects may use: through a named configuration,
                // such as a test output, through their files, or through a source directory.
                def shared = [] as Set
                // The project whose directory holds a file; the root only for its sources and output.
                def projectOf = { File file ->
                    def path = file.toPath().normalize()
                    def found = root.allprojects.findAll { path.startsWith(it.projectDir.toPath()) }
                        .max { it.projectDir.toPath().nameCount }
                    def own = [root.projectDir.toPath().resolve('src'), root.layout.buildDirectory.get().asFile.toPath()]
                    found != root || own.any { path.startsWith(it) } ? found : null
                }
                root.allprojects.each { p ->
                    def key = moduleId(p)
                    if (key != '.' && p.projectDir.canonicalFile != new File(root.projectDir, key).canonicalFile) {
                        throw new GradleException("Automatic setup supports modules in directories that match their project paths; ${p.path} is in ${p.projectDir}.")
                    }
                    if (p.plugins.hasPlugin('com.android.application') || p.plugins.hasPlugin('com.android.library') ||
                        p.plugins.hasPlugin('org.jetbrains.kotlin.multiplatform')) {
                        throw new GradleException('Automatic setup currently supports Java and Kotlin/JVM, not Android or multiplatform builds.')
                    }
                    // Include empty aggregator modules too, so all project dependency edges have an owner.
                    def dependencies = p.configurations.collectMany { c ->
                        c.allDependencies.withType(ProjectDependency).collect { d ->
                            def id = moduleId(GradleVersion.current() >= GradleVersion.version('8.11')
                                ? root.project(d.path) : d.dependencyProject)
                            if (d.targetConfiguration != null && id != key) {
                                shared << id
                            }
                            id
                        }
                    }
                    // Files of another project, such as `project(':a').sourceSets.test.output`.
                    p.configurations.each { c ->
                        c.allDependencies.withType(FileCollectionDependency).each { d ->
                            try {
                                d.files.files.each { file ->
                                    def found = projectOf(file)
                                    if (found != null && found != p) {
                                        dependencies << moduleId(found)
                                        shared << moduleId(found)
                                    }
                                }
                            } catch (Exception ignored) {
                                // Files that cannot be listed here may be any project's tests.
                                shared.addAll(root.allprojects.collect { moduleId(it) })
                            }
                        }
                    }
                    // A source directory inside another project, such as a shared srcDir,
                    // compiles that project's files here too.
                    p.extensions.findByName('sourceSets')?.each { s ->
                        s.allSource.srcDirs.each { dir ->
                            def found = projectOf(dir)
                            if (found != null && found != p) {
                                dependencies << moduleId(found)
                                shared << moduleId(found)
                            }
                        }
                    }
                    modules[key] = dependencies.unique().sort()
                }
                if (!root.allprojects.any { p -> p.plugins.hasPlugin('java') || p.plugins.hasPlugin('org.jetbrains.kotlin.jvm') }) {
                    throw new GradleException('No Java or Kotlin/JVM projects found.')
                }
                new File(root.property('impact.output').toString()).text = JsonOutput.prettyPrint(
                    JsonOutput.toJson([tool: 'gradle', modules: modules, shared_tests: shared.sort(), included_builds: included])) + '\n'
            }
        }
    }
}
