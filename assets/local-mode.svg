<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-labelledby="t d">
  <title id="t">Local mode, one run</title>
  <desc id="d">sieve run --records first checks whether anything changed since the last green run and stops with NONE if not. Otherwise it starts Maven verify or Gradle with the agent loaded through JDK_JAVA_OPTIONS or the init script. During JUnit discovery the agent asks sieve decide which test classes to drop, probes the methods, files, and Spring contexts each test uses, and writes them with sieve record to .sieve/records. The build returns its exit status, XML reports, and a summary.</desc>
  <style>
    text{font-family:Inter,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;fill:#163a66}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .t{font-size:15px;font-weight:600}
    .m{font-size:14px;font-weight:600}
    .s{font-size:12.5px;fill:#4b5f78}
    .card{fill:#f6f8fa;stroke:#d0d7de}
    .node{fill:#fff;stroke:#2c6cb0;stroke-width:1.5}
    .life{stroke:#9fb0c4;stroke-width:1.5;stroke-dasharray:2 5;stroke-linecap:round}
    .edge{fill:none;stroke:#2c6cb0;stroke-width:1.5}
    .ret{stroke-dasharray:6 4}
    .tip{fill:#2c6cb0}
    .hot{fill:none;stroke:#d4970a;stroke-width:2}
    .hottip{fill:#d4970a}
    .halo{paint-order:stroke;stroke:#f6f8fa;stroke-width:5px;stroke-linejoin:round}
    @media (prefers-color-scheme:dark){
      text{fill:#e6edf3}
      .s{fill:#9aa9bb}
      .card{fill:#161b22;stroke:#30363d}
      .node{fill:#0d1117;stroke:#6ea8e8}
      .life{stroke:#3d4b5c}
      .edge{stroke:#6ea8e8}
      .tip{fill:#6ea8e8}
      .hot{stroke:#f6c445}
      .hottip{fill:#f6c445}
      .halo{stroke:#161b22}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="tip" d="M1 1 9 5 1 9z"/></marker>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="hottip" d="M1 1 9 5 1 9z"/></marker>
  </defs>
  <rect class="card" x=".5" y=".5" width="879" height="499" rx="12"/>

  <!-- participants -->
  <path class="life" d="M150 72V476M440 72V476M730 72V476"/>
  <rect class="node" x="40" y="24" width="220" height="48" rx="10"/>
  <text class="t mono" x="150" y="53" text-anchor="middle">sieve run --records</text>
  <rect class="node" x="330" y="24" width="220" height="48" rx="10"/>
  <text class="t" x="440" y="53" text-anchor="middle">Maven / Gradle</text>
  <rect class="node" x="620" y="24" width="220" height="48" rx="10"/>
  <text class="t" x="730" y="53" text-anchor="middle">agent in test JVM</text>

  <!-- 1: shortcut -->
  <path class="edge" marker-end="url(#a)" d="M150 104H178a8 8 0 0 1 8 8V124a8 8 0 0 1 -8 8H154"/>
  <text class="s halo" x="198" y="122">unchanged since the last green run? <tspan class="mono" font-weight="600">NONE</tspan></text>

  <!-- 2: start the build -->
  <text class="m halo mono" x="295" y="168" text-anchor="middle">verify</text>
  <text class="s halo" x="295" y="186" text-anchor="middle">agent via JDK_JAVA_OPTIONS / init script</text>
  <path class="edge" marker-end="url(#a)" d="M150 196H438"/>

  <!-- 3: discovery -->
  <text class="s halo" x="585" y="240" text-anchor="middle">JUnit discovery</text>
  <path class="edge" marker-end="url(#a)" d="M440 250H728"/>

  <!-- 4: decide -->
  <text class="m halo mono" x="585" y="286" text-anchor="middle">sieve decide</text>
  <text class="s halo" x="585" y="304" text-anchor="middle">test classes to drop</text>
  <path class="hot" marker-end="url(#h)" d="M730 314H152"/>

  <!-- 5: probe -->
  <path class="edge" marker-end="url(#a)" d="M730 340H758a8 8 0 0 1 8 8V360a8 8 0 0 1 -8 8H734"/>
  <text class="s halo" x="718" y="358" text-anchor="end">probe methods, files, Spring contexts</text>

  <!-- 6: record -->
  <text class="m halo mono" x="585" y="394" text-anchor="middle">sieve record</text>
  <text class="s halo mono" x="585" y="412" text-anchor="middle">.sieve/records/*.json</text>
  <path class="edge" marker-end="url(#a)" d="M730 422H152"/>

  <!-- 7: result -->
  <text class="s halo" x="295" y="448" text-anchor="middle">exit status, XML reports, summary</text>
  <path class="edge ret" marker-end="url(#a)" d="M440 458H152"/>
</svg>
